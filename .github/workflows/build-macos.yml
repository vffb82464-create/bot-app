name: Build macOS app
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish this version's DMG files as a GitHub release
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Create macOS app icon
        run: npm run icon:mac
      - name: Build DMG and ZIP installers
        run: npm run dist:mac
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: Discord-Bot-App-macOS
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
          compression-level: 0
      - name: Publish versioned DMG release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          gh release create "v${version}" dist/*.dmg \
            --title "Discord Bot App ${version}" \
            --notes "Installateurs macOS Intel (x64) et Apple Silicon (arm64)."
