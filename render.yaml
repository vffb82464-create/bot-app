services:
  - type: web
    name: panel-bot-discord
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run web
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: BOT_SYNC_ONLY
        value: true
      - key: BOT_SYNC_SECRET
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_REDIRECT_URI
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: PANEL_ADMIN_PASSWORD
        sync: false
      - key: GIPHY_API_KEY
        sync: false
